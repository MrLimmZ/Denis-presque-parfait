<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un Denis Presque Parfait</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-loader" id="page-loader">
    <span class="share-spinner"></span>
  </div>

  <div id="app-logo"></div>

  <div data-barba="wrapper">
    <main class="wrap wrap-center" data-barba="container" data-barba-namespace="home">
      <div class="profile-select" id="profile-selection">
        <span class="label profile-select-label">Qui es-tu ?</span>
        <div class="participants-list" id="participants-list">
          <p class="hint" id="participants-empty">Aucun participant pour le moment.</p>
        </div>
      </div>

      <div class="state-card setup-notice" id="setup-notice" style="display: none;">
        <div class="state-card-icon state-card-icon-setup">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8v4l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <span class="state-card-eyebrow">Patiente un peu</span>
        <h2 class="state-card-title">En cours de configuration</h2>
        <p class="state-card-subtitle" id="setup-notice-text">La partie est en train d'être préparée.</p>
        <a href="panel.html" class="btn btn-secondary setup-notice-btn">Ouvrir le panel admin</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="client.js"></script>
  <script src="avatar.js"></script>
  <script src="logo.js"></script>
  <script src="splash.js"></script>
  <script src="share.js"></script>
  <script src="calendar.js"></script>
  <script src="rating.js"></script>
  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>

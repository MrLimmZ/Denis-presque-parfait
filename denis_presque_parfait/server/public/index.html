<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un Denis Presque Parfait</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-loader" id="page-loader">
    <span class="share-spinner"></span>
  </div>

  <div id="app-logo"></div>

  <main class="wrap" id="main">
    <h1>Un Denis Presque Parfait</h1>

    <div class="participants-section">
      <span class="label">Qui es-tu ?</span>
      <div class="participants-list" id="participants-list">
        <p class="hint" id="participants-empty">Aucun participant pour le moment.</p>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="client.js"></script>
  <script src="avatar.js"></script>
  <script src="logo.js"></script>
  <script src="share.js"></script>
  <script>
    initShareButton({ title: "Un Denis Presque Parfait" });
    initLogo();

    const loadStart = Date.now();
    const existingParticipant = getCookie("participant_id");

    const mainEl = document.getElementById("main");
    const loaderEl = document.getElementById("page-loader");
    const listEl = document.getElementById("participants-list");
    const emptyEl = document.getElementById("participants-empty");

    let participantsLoaded = false;
    let gameStatusKnown = false;
    let redirecting = false;

    function reveal() {
      if (redirecting) return;
      if (!participantsLoaded || !gameStatusKnown) return;
      withMinDelay(loadStart, 300, () => {
        loaderEl.style.display = "none";
        mainEl.classList.add("is-ready");
      });
    }

    function renderParticipants(list) {
      listEl.innerHTML = "";
      if (!list || list.length === 0) {
        listEl.appendChild(emptyEl);
        return;
      }
      list.forEach((p) => {
        const btn = document.createElement("button");
        btn.className = "participant-btn";
        btn.appendChild(createAvatarElement(p, "md"));

        const nameSpan = document.createElement("span");
        nameSpan.textContent = p.name;
        btn.appendChild(nameSpan);

        btn.addEventListener("click", () => {
          setCookie("participant_id", p.id);
          window.location.href = "game.html";
        });
        listEl.appendChild(btn);
      });
    }

    const ws = connectWS({
      onParticipants: (list) => {
        participantsLoaded = true;
        renderParticipants(list);
        reveal();
      },
      onGameStatus: (complete) => {
        gameStatusKnown = true;
        if (complete) {
          redirecting = true;
          window.location.href = "results.html";
        } else if (existingParticipant) {
          redirecting = true;
          window.location.replace("game.html");
        } else {
          reveal();
        }
      },
      onGameComplete: () => {
        redirecting = true;
        window.location.href = "results.html";
      },
      onDbResetDone: () => {},
    });

    ws.send(JSON.stringify({ type: "game:status" }));
  </script>
</body>
</html>

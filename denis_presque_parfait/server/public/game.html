<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un Denis Presque Parfait</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-loader" id="page-loader">
    <span class="share-spinner"></span>
  </div>

  <div id="app-logo"></div>

  <div data-barba="wrapper">
    <main class="wrap wrap-center" data-barba="container" data-barba-namespace="game">
            <button id="back-btn" class="fab fab-left" title="Changer de participant">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="game-content"></div>

      <section class="assignment-view" id="assignment-view" style="display: none;">
        <span class="label">Calendrier des jours attribués</span>
        <div class="calendar" id="assignment-calendar"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="client.js"></script>
  <script src="avatar.js"></script>
  <script src="logo.js"></script>
  <script src="splash.js"></script>
  <script src="share.js"></script>
  <script src="calendar.js"></script>
  <script src="rating.js"></script>
  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>

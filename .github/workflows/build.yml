# Construit l'image Docker de l'add-on et la publie sur GitHub Container Registry.
# Home Assistant n'a plus qu'à la télécharger (config.yaml -> image:) au lieu de
# tout reconstruire sur la box à chaque mise à jour.
name: Build add-on image

on:
  push:
    branches: [main]
    paths:
      - "denis_presque_parfait/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Machine ARM 64 bits native (gratuite pour les dépôts publics) : même
    # architecture que la box, donc pas d'émulation lente.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version de l'add-on
        id: meta
        run: |
          version=$(sed -nE 's/^version: "([^"]+)"/\1/p' denis_presque_parfait/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/denis-presque-parfait-aarch64" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: denis_presque_parfait
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=aarch64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
